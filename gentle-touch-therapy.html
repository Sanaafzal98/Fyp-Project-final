<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gentle Touch Healing | Soft Experience</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
/* CSS Variables for easy color management */
:root {
  --bg-pink: #ffd6e8;
  --dark-pink: #8b2c5c;
  --accent-pink: #ff7fb0;
  --glass: rgba(255, 255, 255, 0.4);
}

*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at center, #ffffff 0%, var(--bg-pink) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: manipulation; /* Mobile par double tap zoom rokne ke liye */
}

/* BACK BUTTON */
.back {
  position: absolute;
  top: 30px;
  left: 30px;
  background: white;
  border: none;
  padding: 8px 15px;
  border-radius: 20px;
  color: var(--dark-pink);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
  transition: 0.3s;
}

.back:hover { transform: translateX(-5px); }

/* MAIN CARD */
.card {
  width: 90%;
  max-width: 500px;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 40px;
  padding: 50px 30px;
  text-align: center;
  box-shadow: 0 30px 60px rgba(139, 44, 92, 0.1);
}

h1 {
  color: var(--dark-pink);
  font-weight: 500;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}

p {
  color: #8a6378;
  font-size: 14px;
  margin-bottom: 30px;
  opacity: 0.8;
}

/* TOUCH AREA */
.touch-area {
  position: relative;
  width: 100%;
  height: 300px;
  background: var(--glass);
  border-radius: 30px;
  overflow: hidden;
  cursor: crosshair;
}

/* DOTS */
.dot {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: var(--accent-pink);
  position: absolute;
  filter: blur(2px);
  box-shadow: 0 0 20px var(--accent-pink);
  cursor: pointer;
  transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  animation: float 4s ease-in-out infinite alternate;
}

@keyframes float {
  from { transform: translate(0, 0); }
  to { transform: translate(10px, 15px); }
}

/* HEALED STATE */
.dot.healed {
  transform: scale(0);
  opacity: 0;
  pointer-events: none;
}

/* MESSAGE */
.message {
  margin-top: 25px;
  font-size: 15px;
  color: var(--dark-pink);
  font-weight: 500;
  height: 24px;
  transition: 0.3s;
}

/* RESET BUTTON */
#reset-btn {
  margin-top: 15px;
  padding: 8px 20px;
  border-radius: 15px;
  border: none;
  background: var(--dark-pink);
  color: white;
  cursor: pointer;
  display: none;
}
</style>
</head>
<body>

<button class="back" onclick="history.back()">← Back</button>

<div class="card">
  <h1>Gentle Healing</h1>
  <p>Every touch is a step toward peace.</p>

  <div class="touch-area" id="area">
    </div>

  <div class="message" id="msg">Tap the glowing energy to heal</div>
  <button id="reset-btn" onclick="initGame()">Try Again</button>
</div>

<script>
const area = document.getElementById('area');
const msg = document.getElementById('msg');
const resetBtn = document.getElementById('reset-btn');
let dotsCount = 5;

// Function to start or reset the session
function initGame() {
  area.innerHTML = '';
  resetBtn.style.display = 'none';
  msg.innerText = "Tap the glowing energy to heal";
  msg.style.color = "var(--dark-pink)";

  for(let i=0; i < dotsCount; i++) {
    createDot();
  }
}

function createDot() {
  const dot = document.createElement('div');
  dot.className = 'dot';
  
  // Random position within the area
  const x = Math.random() * 80 + 10; // 10% to 90%
  const y = Math.random() * 80 + 10; 
  
  dot.style.left = `${x}%`;
  dot.style.top = `${y}%`;
  // Har dot ki animation thodi alag timing pe hogi
  dot.style.animationDelay = `${Math.random() * 2}s`;

  dot.addEventListener('click', function() {
    this.classList.add('healed');
    checkProgress();
  });

  area.appendChild(dot);
}

function checkProgress() {
  const remaining = document.querySelectorAll('.dot:not(.healed)').length;
  
  if (remaining > 0) {
    msg.innerText = "🌸 Softly, you are doing great...";
  } else {
    msg.innerText = "Everything is healed. You are at peace. ✨";
    msg.style.color = "#2c7a52"; // Success Green-ish
    resetBtn.style.display = 'inline-block';
  }
}

// Start for the first time
initGame();
</script>

</body>
</html>
