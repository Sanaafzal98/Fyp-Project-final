<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Breathing Therapy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#ffd6e8,#fbc8e4);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* MAIN CARD */
.card{
  width:90%;
  max-width:520px;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(18px);
  border-radius:30px;
  padding:40px 30px;
  text-align:center;
  box-shadow:0 25px 60px rgba(255,120,180,0.3);
}

/* BACK */
.back{
  position:absolute;
  top:20px;
  left:20px;
  background:none;
  border:none;
  font-size:14px;
  color:#8b2c5c;
  cursor:pointer;
}

/* TEXT */
h1{
  color:#7a2c52;
  margin-bottom:10px;
}
p{
  color:#6b3b56;
  font-size:14px;
  margin-bottom:30px;
}

/* BREATHING CIRCLE */
.circle-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  height:220px;
}

.circle{
  width:120px;
  height:120px;
  border-radius:50%;
  background:radial-gradient(circle,#ffb6d5,#ff7fb0);
  animation:breathing 6s ease-in-out infinite;
  box-shadow:0 0 70px rgba(255,120,180,0.6);
}

@keyframes breathing{
  0%{transform:scale(1);}
  50%{transform:scale(1.6);}
  100%{transform:scale(1);}
}

/* INSTRUCTION */
.instruction{
  margin-top:20px;
  font-size:15px;
  color:#7a2c52;
}

/* AFFIRMATION */
.affirmation{
  margin-top:25px;
  font-size:14px;
  color:#8b2c5c;
  opacity:0.9;
}
</style>
</head>

<body>

<button class="back" onclick="history.back()">← Back</button>

<div class="card">
  <h1>Skin Breathing Therapy</h1>
  <p>Slow down. Let your skin relax with your breath.</p>

  <div class="circle-wrap">
    <div class="circle"></div>
  </div>

  <div class="instruction">
    Inhale as the circle expands  
    <br>
    Exhale as it softens
  </div>

  <div class="affirmation">
    Your skin is safe.  
    You are doing enough.
  </div>
</div>

</body>
</html>
